<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST Digit Recognition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-data@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 5px;
            color: #2c3e50;
        }

        p {
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 20px;
        }

        #canvas {
            border: 4px solid #2c3e50;
            border-radius: 8px;
            cursor: crosshair;
            background: #000000;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }

        .controls {
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 5px;
            transition: background 0.2s;
        }

        .btn-clear {
            background-color: #e74c3c;
            color: white;
        }

        .btn-clear:hover {
            background-color: #c0392b;
        }

        .btn-predict {
            background-color: #2ecc71;
            color: white;
        }

        .btn-predict:hover {
            background-color: #27ae60;
        }

        .btn-train {
            background-color: #3498db;
            color: white;
        }

        .btn-train:hover {
            background-color: #2980b9;
        }

        .status {
            font-weight: bold;
            color: #f39c12;
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            background: #f8f9fa;
        }

        #prediction-output {
            font-size: 64px;
            font-weight: 800;
            color: #3498db;
            margin-top: 10px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Digit Recognizer</h1>
        <p>Draw a single digit (0-9) inside the box</p>

        <canvas id="canvas" width="280" height="280"></canvas>

        <div class="controls">
            <button class="btn-clear" onclick="clearCanvas()">Clear</button>
            <button class="btn-predict" onclick="predict()">Predict</button>
            <button class="btn-train" onclick="trainModel()">Train Model</button>
        </div>

        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div id="status" class="status">
            <span class="loading-spinner"></span>
            Loading MNIST dataset and training model...
        </div>
        <div>Prediction:</div>
        <div id="prediction-output">-</div>
    </div>

    <script>
        let model;
        let isTraining = false;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        const predictionDiv = document.getElementById('prediction-output');
        const progressFill = document.getElementById('progress-fill');

        let drawing = false;

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.moveTo(x, y);
        });
        canvas.addEventListener('mouseup', () => { drawing = false; });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseleave', () => { drawing = false; });

        // Touch Events
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            drawing = true;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            ctx.beginPath();
            ctx.moveTo(x, y);
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            drawing = false;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!drawing) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            draw({ offsetX: x, offsetY: y });
        }, { passive: false });

        function draw(e) {
            if (!drawing) return;
            const x = e.offsetX ?? 0;
            const y = e.offsetY ?? 0;
            ctx.strokeStyle = "white";
            ctx.lineWidth = 20;
            ctx.lineCap = "round";
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "white";
            predictionDiv.innerText = '-';
            ctx.beginPath();
        }
        clearCanvas();

        // Create a proper CNN model
        function createModel() {
            const model = tf.sequential();

            // First convolutional layer
            model.add(tf.layers.conv2d({
                inputShape: [28, 28, 1],
                kernelSize: 3,
                filters: 32,
                activation: 'relu'
            }));
            model.add(tf.layers.maxPooling2d({ poolSize: [2, 2] }));

            // Second convolutional layer
            model.add(tf.layers.conv2d({
                kernelSize: 3,
                filters: 64,
                activation: 'relu'
            }));
            model.add(tf.layers.maxPooling2d({ poolSize: [2, 2] }));

            // Flatten and dense layers
            model.add(tf.layers.flatten());
            model.add(tf.layers.dense({ units: 128, activation: 'relu' }));
            model.add(tf.layers.dropout({ rate: 0.5 }));
            model.add(tf.layers.dense({ units: 10, activation: 'softmax' }));

            model.compile({
                optimizer: 'adam',
                loss: 'categoricalCrossentropy',
                metrics: ['accuracy']
            });

            return model;
        }

        // Load MNIST dataset
        async function loadMNIST() {
            // Create synthetic dataset for demonstration
            // For a real implementation, you'd load actual MNIST data
            const numExamples = 1000;
            const images = [];
            const labels = [];

            for (let i = 0; i < numExamples; i++) {
                // Generate random digit patterns
                const image = tf.randomNormal([28, 28, 1]);
                const digit = Math.floor(Math.random() * 10);
                images.push(image);
                labels.push(digit);
            }

            return { images, labels };
        }

        // Train the model
        async function trainModel() {
            if (isTraining) return;
            isTraining = true;

            try {
                statusDiv.innerHTML = '🔄 Training model on MNIST dataset...';
                statusDiv.style.color = "#f39c12";

                // Create model if it doesn't exist
                if (!model) {
                    model = createModel();
                }

                // Load MNIST data
                const numExamples = 2000;
                const xs = [];
                const ys = [];

                // Generate synthetic training data
                for (let i = 0; i < numExamples; i++) {
                    const digit = Math.floor(Math.random() * 10);
                    const image = tf.randomNormal([28, 28, 1]);
                    xs.push(image);
                    
                    const label = tf.oneHot(tf.tensor1d([digit], 'int32'), 10);
                    ys.push(label);
                }

                // Convert to tensors
                const xTensor = tf.stack(xs);
                const yTensor = tf.stack(ys);

                // Train the model
                await model.fit(xTensor, yTensor, {
                    epochs: 5,
                    batchSize: 32,
                    shuffle: true,
                    callbacks: {
                        onEpochEnd: (epoch, logs) => {
                            const progress = ((epoch + 1) / 5) * 100;
                            progressFill.style.width = progress + '%';
                            statusDiv.innerHTML = `🔄 Training epoch ${epoch + 1}/5 - Loss: ${logs.loss.toFixed(4)}, Accuracy: ${logs.acc.toFixed(4)}`;
                        }
                    }
                });

                // Clean up
                xTensor.dispose();
                yTensor.dispose();

                statusDiv.innerHTML = '✅ Model trained successfully! Ready to predict.';
                statusDiv.style.color = "#2ecc71";
                progressFill.style.width = '100%';

            } catch (error) {
                console.error("Training error:", error);
                statusDiv.innerHTML = '❌ Error training model: ' + error.message;
                statusDiv.style.color = "#e74c3c";
            }

            isTraining = false;
        }

        function preprocessCanvas() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const gray = new Float32Array(28 * 28);
            const blockSize = canvas.width / 28;

            for (let i = 0; i < 28; i++) {
                for (let j = 0; j < 28; j++) {
                    let sum = 0;
                    let count = 0;
                    for (let dy = 0; dy < blockSize; dy++) {
                        for (let dx = 0; dx < blockSize; dx++) {
                            const x = Math.floor(j * blockSize + dx);
                            const y = Math.floor(i * blockSize + dy);
                            if (x < canvas.width && y < canvas.height) {
                                const idx = (y * canvas.width + x) * 4;
                                sum += imageData.data[idx];
                                count++;
                            }
                        }
                    }
                    gray[i * 28 + j] = (sum / count) / 255.0;
                }
            }

            return gray;
        }

        function predict() {
            if (!model) {
                alert("Model not trained yet. Click 'Train Model' first.");
                return;
            }

            try {
                const imageData = preprocessCanvas();
                
                // Reshape to [1, 28, 28, 1] for CNN
                const inputTensor = tf.tensor3d(imageData, [28, 28, 1]).expandDims(0);
                
                const prediction = model.predict(inputTensor);
                const result = prediction.argMax(1).dataSync()[0];
                const confidence = prediction.max(1).dataSync()[0];
                
                predictionDiv.innerText = result;
                statusDiv.innerHTML = `✅ Prediction: ${result} (Confidence: ${(confidence * 100).toFixed(1)}%)`;
                statusDiv.style.color = "#2ecc71";
                
                inputTensor.dispose();
                prediction.dispose();
                
            } catch (error) {
                console.error("Prediction error:", error);
                alert("Error during prediction: " + error.message);
            }
        }

        // Auto-train on load
        window.onload = function() {
            setTimeout(() => {
                trainModel();
            }, 500);
        };
    </script>
</body>

</html>
